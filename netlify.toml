# إعدادات Netlify — لا يحتاج المشروع إلى أي خطوة بناء؛ الملفات تُنشر كما هي.
[build]
  publish = "."
  command = ""

# لا تُخزَّن ملفات JS/HTML في الكاش طويلًا حتى تصل التعديلات الجديدة للجميع فورًا.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
