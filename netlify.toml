# ============================================================
#  دفتر — إعدادات Netlify (نفس آلية متجر CampusKart)
#  لا يحتاج أي خطوة بناء؛ الملفات تُنشر كما هي مع الدوال.
# ============================================================

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------- ترويسات أمان لكل الصفحات ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# ---------- لا كاش لملفات التطبيق حتى تصل التعديلات للجميع فورًا ----------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
